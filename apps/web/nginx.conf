server {
  listen 80;
  root /usr/share/nginx/html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # One origin for the site and the API: no CORS, and the session token never crosses sites.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    # Overwrite, never append: a client-sent X-Forwarded-For can't fake its IP past the limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Hashed file names change with every build, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Client-side routes (/applications/12, /verify/CODE) all load index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
