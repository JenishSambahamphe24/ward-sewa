name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ward_sewa
          POSTGRES_PASSWORD: ward_sewa_dev
          POSTGRES_DB: ward_sewa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ward_sewa" --health-interval 5s --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @ward-sewa/nepal-utils coverage
      - run: pnpm --filter @ward-sewa/api test
      - run: pnpm --filter @ward-sewa/api test:integration

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Start the full stack
        run: docker compose up -d --build --wait
      - name: Readiness check
        run: curl --fail --silent --show-error localhost:3000/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose logs
