name: ward-sewa

# Ports bind to 127.0.0.1 only, so the databases aren't reachable from other machines on your network.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ward_sewa
      POSTGRES_PASSWORD: ward_sewa_dev
      POSTGRES_DB: ward_sewa
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ward_sewa -d ward_sewa']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    # 8.x refuses to start on Linux kernel 6.19+ (SERVER-121912); revisit when fixed.
    image: mongo:7.0
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # Append-only file so queued jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    # Host port 6380 to avoid clashing with a locally installed Redis on 6379.
    ports: ['127.0.0.1:6380:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/src/db/migrate.ts', '--seed']
    environment:
      DATABASE_URL: postgres://ward_sewa:ward_sewa_dev@postgres:5432/ward_sewa
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ward_sewa:ward_sewa_dev@postgres:5432/ward_sewa
      MONGO_URL: mongodb://mongo:27017/ward_sewa
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-change-me-dev-only-change-me-0000
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:3000
    volumes: [uploads-data:/data/uploads]
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/src/worker.ts']
    environment:
      DATABASE_URL: postgres://ward_sewa:ward_sewa_dev@postgres:5432/ward_sewa
      MONGO_URL: mongodb://mongo:27017/ward_sewa
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:3000
    volumes: [uploads-data:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }

volumes:
  uploads-data:
  postgres-data:
  mongo-data:
  redis-data:
